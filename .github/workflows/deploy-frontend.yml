name: Déployer le site sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifier que l'adresse de l'API est configurée
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "::error::Ajoutez la variable API_URL dans Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Injecter l'adresse de l'API
        run: sed -i "s#__API_URL__#${{ vars.API_URL }}#" src/environments/environment.prod.ts

      - name: Construire le site
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Page de secours pour les liens directs
        run: cp dist/immogest/browser/index.html dist/immogest/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/immogest/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
